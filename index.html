<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Somehow I Managed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; color: #111; }
    p { color: #555; margin-bottom: 1.5rem; line-height: 1.5; }
    label { display: block; font-size: 0.875rem; font-weight: 500; color: #333; margin-bottom: 0.35rem; }
    input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #4f46e5; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    #message {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    #message.success { background: #ecfdf5; color: #065f46; display: block; }
    #message.error   { background: #fef2f2; color: #991b1b; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Somehow I Managed</h1>
    <p>Join our mailing list and we'll send you a welcome email right away.</p>
    <form id="signup-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />
      <button type="submit" id="submit-btn">Subscribe</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const btn  = document.getElementById('submit-btn');
    const msg  = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Subscribing…';
      msg.className = '';
      msg.style.display = 'none';

      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();

      try {
        const res = await fetch('/.netlify/functions/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email }),
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = 'success';
          msg.textContent = data.message || 'You\'re subscribed! Check your inbox.';
          form.reset();
        } else {
          throw new Error(data.error || 'Something went wrong.');
        }
      } catch (err) {
        msg.className = 'error';
        msg.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Subscribe';
      }
    });
  </script>
</body>
</html>
